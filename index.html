<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 100 Best TV Shows of the 21st Century — Where to Watch in India</title>
<style>
  :root {
    --ink: #121212;
    --paper: #fbfaf7;
    --muted: #6b6b6b;
    --line: #e2ded4;
    --accent: #b03030;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.45;
  }
  header {
    border-bottom: 3px double var(--ink);
    padding: 44px 32px 18px;
    text-align: center;
  }
  .kicker {
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 10px;
  }
  h1 {
    margin: 0;
    font-size: clamp(26px, 4.6vw, 50px);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header p.source {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    color: var(--muted);
    margin: 12px 0 0;
  }
  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    padding: 16px 32px 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 7px 13px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    border-radius: 2px;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  #status { font-size: 13px; color: var(--muted); min-height: 1.2em; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    justify-content: center;
    padding: 14px 32px 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .chip {
    font-size: 12px;
    padding: 5px 11px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    cursor: pointer;
    color: var(--muted);
    user-select: none;
  }
  .chip .n { opacity: 0.55; margin-left: 5px; }
  .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip.active .n { opacity: 0.7; }

  .sortbar {
    font-size: 13px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button.sort { border-color: var(--line); color: var(--muted); padding: 5px 11px; }
  button.sort.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .grouphead {
    break-inside: avoid;
    break-after: avoid-column;
    list-style: none;
    margin: 18px 0 2px;
    padding: 0 0 3px;
    border-bottom: 2px solid var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .grouphead:first-child { margin-top: 0; }
  .grouphead .gn { color: var(--muted); font-weight: 400; margin-left: 6px; text-transform: none; letter-spacing: 0; }

  main {
    columns: 2;
    column-gap: 46px;
    padding: 26px 32px 60px;
    max-width: 1180px;
    margin: 0 auto;
  }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    break-inside: avoid;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  li.hidden { display: none; }
  .rank {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    flex: 0 0 2.1rem;
  }
  .title { font-weight: 700; flex: 1 1 auto; min-width: 0; }
  .years, .plats {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .plats { text-align: right; flex: 0 1 auto; }
  li input[type="checkbox"] { flex: 0 0 auto; }
  .badge {
    display: inline-block;
    padding: 1px 7px;
    margin: 1px 0 1px 3px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    white-space: nowrap;
  }
  .badge.none { color: var(--accent); border-color: #e3c9c9; }
  li.watched .title::after { content: " ✓"; color: var(--accent); }
  input[type="checkbox"] { accent-color: var(--accent); }
  footer {
    border-top: 3px double var(--ink);
    padding: 16px 32px 40px;
    text-align: center;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    color: var(--muted);
  }
  @media (max-width: 780px) {
    main { columns: 1; }
  }
  @media print {
    .tools, .filters { display: none; }
    main { columns: 2; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<header>
  <p class="kicker">The New York Times</p>
  <h1>The 100 Best TV Shows of the 21st Century</h1>
  <p class="source">Explore the list at nytimes.com/bestTV &middot; India streaming availability verified October 2026</p>
</header>

<div class="tools">
  <button id="markAll">I've seen it all</button>
  <button id="clearAll">Clear all</button>
  <span class="sortbar">Sort by:
    <button class="sort active" data-sort="rank">Ranking</button>
    <button class="sort" data-sort="platform">OTT platform</button>
    <button class="sort" data-sort="title">A–Z</button>
  </span>
  <span id="status"></span>
</div>

<div class="filters" id="filters"></div>

<main>
  <ol id="list"></ol>
</main>

<footer>Watchlist progress is saved in this browser</footer>

<script>
const NONE = "Not streaming in India";

// [title, years, [platforms], note]
const SHOWS = [
  ["Breaking Bad","2008-2013",["Netflix"],"All 5 seasons"],
  ["The Wire","2002-2008",["JioHotstar"],"Via HBO bundle"],
  ["Mad Men","2007-2015",["Lionsgate Play","Prime Video"],"Partial seasons"],
  ["Succession","2018-2023",["JioHotstar"],"All 4 seasons"],
  ["Fleabag","2016-2019",["Prime Video"],"Both seasons"],
  ["Game of Thrones","2011-2019",["JioHotstar"],"All 8 seasons"],
  ["Veep","2012-2019",["JioHotstar"],"All 7 seasons"],
  ["30 Rock","2006-2013",["Netflix","JioHotstar"],"All 7 seasons"],
  ["Curb Your Enthusiasm","2000-2024",["JioHotstar"],"All 12 seasons"],
  ["Atlanta","2016-2022",[NONE],"FX title"],
  ["The Office (U.S.)","2005-2013",["Netflix","Prime Video","JioHotstar"],"All 9 seasons"],
  ["Arrested Development","2003-2019",["JioHotstar"],"5 seasons"],
  ["Gits","2012-2017",["Prime Video"],"Hindi dub available"],
  ["Friday Night Lights","2006-2011",[NONE],""],
  ["Six Feet Under","2001-2005",["JioHotstar"],"All 5 seasons"],
  ["The Office (U.K.)","2001-2003",[NONE],"BBC, UK only"],
  ["The Americans","2013-2018",["JioHotstar"],"All 6 seasons"],
  ["I May Destroy You","2020",["JioHotstar"],"Miniseries"],
  ["Chernobyl","2019",["JioHotstar"],"5 episodes"],
  ["The Crown","2016-2023",["Netflix"],"All 6 seasons"],
  ["The White Lotus","2021-present",["JioHotstar"],"3 seasons"],
  ["Lost","2004-2010",[NONE],""],
  ["The Comeback","2005-2026",["JioHotstar"],"Incl. Season 3"],
  ["Deadwood","2004-2006",[NONE],"Paramount+ not in India"],
  ["The Leftovers","2014-2017",["JioHotstar"],"3 seasons"],
  ["Black Mirror","2011-present",["Netflix"],"All seasons"],
  ["Better Call Saul","2015-2022",["Netflix"],"All 6 seasons"],
  ["Band of Brothers","2001",["JioHotstar"],"Miniseries"],
  ["Key & Peele","2012-2015",["JioHotstar"],"Free with ads"],
  ["Severance","2022-present",["Apple TV+","Prime Video"],"Apple TV add-on in Prime"],
  ["Survivor","2000-present",["JioHotstar"],"US original"],
  ["Andor","2022-2025",["JioHotstar"],"2 seasons"],
  ["Enlightened","2011-2013",["JioHotstar"],"2 seasons"],
  ["Schitt's Creek","2015-2020",["Lionsgate Play","Prime Video"],"Free with ads on Prime"],
  ["True Detective (Season 1)","2014",["JioHotstar"],"Season 1"],
  ["The Pitt","2025-present",["JioHotstar"],""],
  ["Battlestar Galactica","2005-2009",[NONE],"Peacock exclusive"],
  ["Homeland","2011-2020",["JioHotstar"],"All 8 seasons"],
  ["Watchmen","2019",["JioHotstar"],"Miniseries"],
  ["Adolescence","2025",["Netflix"],"4 episodes"],
  ["Louie","2010-2015",[NONE],""],
  ["Hacks","2021-2025",["JioHotstar","Netflix"],"All 5 seasons"],
  ["Peaky Blinders","2013-2022",["Netflix"],"All 6 seasons"],
  ["BoJack Horseman","2014-2020",["Netflix"],"All 6 seasons"],
  ["Happy Valley","2014-2023",["Prime Video"],"Seasons 1-3"],
  ["Broad City","2014-2018",["JioHotstar"],"5 seasons"],
  ["Twin Peaks: The Return","2017",["MUBI"],"MUBI / Prime channel"],
  ["House of Cards","2013-2018",["Netflix"],"6 seasons"],
  ["Normal People","2020",["Lionsgate Play"],"Miniseries"],
  ["Parks and Recreation","2009-2015",["JioHotstar"],"All 7 seasons"],
  ["The Good Place","2016-2020",["Netflix"],"All 4 seasons"],
  ["Downton Abbey","2010-2015",["JioHotstar"],"Plus specials"],
  ["Stranger Things","2016-2025",["Netflix"],"All seasons"],
  ["The Bureau","2015-2020",[NONE],"No India rights"],
  ["Insecure","2021-2025",["JioHotstar"],"All 5 seasons"],
  ["Nathan for You","2013-2017",[NONE],""],
  ["I Think You Should Leave","2019-present",["Netflix"],"3 seasons"],
  ["Chappelle's Show","2003-2006",[NONE],"Paramount+ rights"],
  ["PEN15","2019-2021",[NONE],"Hulu/Disney+ exclusive"],
  ["Peep Show","2003-2015",[NONE],"BBC Three"],
  ["RuPaul's Drag Race","2009-present",["WOW Presents Plus"],"Left Netflix India Sept 2025"],
  ["Slow Horses","2022-present",["Apple TV+"],"Free tier with ads"],
  ["The Thick of It","2005-2012",[NONE],""],
  ["Anthony Bourdain: Parts Unknown","2013-2018",[NONE],""],
  ["Mare of Easttown","2021",["JioHotstar"],"Miniseries"],
  ["The Rehearsal","2022-present",["JioHotstar"],"Seasons 1-3"],
  ["The Handmaid's Tale","2017-2025",["Prime Video"],"All 6 seasons"],
  ["Ozark","2017-2022",["Netflix"],"All 4 seasons"],
  ["Anthony Bourdain: No Reservations","2005-2012",["Prime Video"],"Via Discovery+ channel"],
  ["The Shield","2002-2008",["Vi Movies & TV"],"Seasons 1-5 only"],
  ["Beef (Season 1)","2023",["Netflix"],"Season 1 (+ S2)"],
  ["Squid Game","2021-2025",["Netflix"],"All seasons"],
  ["Barry","2018-2023",["JioHotstar"],"3 seasons"],
  ["The Bear","2022-2026",["JioHotstar"],"Seasons 1-3 in India"],
  ["Ted Lasso","2020-present",["Apple TV+"],"Free with ads"],
  ["Somebody Somewhere","2022-2024",["JioHotstar"],"3 seasons"],
  ["Modern Family","2009-2019",["JioHotstar"],"All 11 seasons"],
  ["It's Always Sunny in Philadelphia","2005-present",["JioHotstar"],"Seasons 1-17"],
  ["The Good Wife","2009-2016",["Prime Video","JioHotstar"],"All 7 seasons"],
  ["How To With John Wilson","2020-2023",["JioHotstar"],"3 seasons"],
  ["The Queen's Gambit","2020",["Netflix"],"Miniseries"],
  ["Better Things","2016-2022",[NONE],""],
  ["Justified","2010-2015",["Prime Video"],"Sony Pictures channel"],
  ["Planet Earth","2006",["SonyLIV"],"Also on Prime channel"],
  ["The Great British Baking Show","2010-present",[NONE],"Channel 4 original"],
  ["Shogun","2024-present",["JioHotstar"],""],
  ["Reservation Dogs","2021-2023",[NONE],"Not licensed in India"],
  ["Dexter","2006-2013",["Prime Video","JioHotstar"],"All 8 seasons"],
  ["Baby Reindeer","2024",["Netflix"],"7 episodes"],
  ["Eastbound & Down","2009-2013",["JioHotstar"],"All 4 seasons"],
  ["Catastrophe","2015-2019",[NONE],""],
  ["The Night Of","2016",["JioHotstar"],"8 episodes"],
  ["Station Eleven","2021-2022",["JioHotstar"],"2 seasons"],
  ["The Diplomat","2023-present",["Netflix"],"Season 3 in 2026"],
  ["House","2004-2012",["Netflix","JioHotstar"],"All 8 seasons"],
  ["Halt and Catch Fire","2014-2017",[NONE],"AMC title"],
  ["Community","2009-2015",["Netflix","Prime Video"],"Sony Pictures channel on Prime"],
  ["The OA","2016-2019",["Netflix"],"2 seasons"],
  ["Gilmore Girls","2000-2007",["Netflix","Prime Video"],""],
  ["Scandal","2012-2018",[NONE],""]
];

const KEY = "nyt-best-tv-100";
const list = document.getElementById("list");
const status = document.getElementById("status");
const filters = document.getElementById("filters");
let seen = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let activePlatform = null;
let activeSort = "rank";

// index shows: platform -> [show indices in rank order]
const byPlatform = {};
SHOWS.forEach(([title, years, platforms, note], i) => {
  platforms.forEach(p => {
    (byPlatform[p] = byPlatform[p] || []).push(i);
  });
});

SHOWS.forEach(([title, years, platforms, note], i) => {
  const li = document.createElement("li");
  li.dataset.title = title;
  li.innerHTML =
    '<span class="rank">' + (i + 1) + '.</span>' +
    '<span class="title"></span>' +
    '<span class="years" title="' + note + '">' + years + '</span>' +
    '<span class="plats"></span>';
  li.querySelector(".title").textContent = title;

  const plats = li.querySelector(".plats");
  platforms.forEach(p => {
    const b = document.createElement("span");
    b.className = "badge" + (p === NONE ? " none" : "");
    b.textContent = p;
    plats.appendChild(b);
  });
  li.dataset.platforms = platforms.join("|");

  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = seen.has(title);
  box.addEventListener("change", () => {
    if (box.checked) seen.add(title); else seen.delete(title);
    li.classList.toggle("watched", box.checked);
    save();
  });
  li.appendChild(box);
  li.classList.toggle("watched", box.checked);
  list.appendChild(li);
});

// platform filter chips, ordered by how many shows each platform carries
const counts = Object.entries(byPlatform).map(([p, arr]) => [p, arr.length]);
counts.sort((a, b) => b[1] - a[1]);
counts.forEach(([p, n]) => {
  const chip = document.createElement("button");
  chip.className = "chip";
  chip.innerHTML = p.replace(/</g, "&lt;") + '<span class="n">' + n + '</span>';
  chip.addEventListener("click", () => {
    activePlatform = activePlatform === p ? null : p;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    if (activePlatform) chip.classList.add("active");
    applySortAndFilter();
  });
  filters.appendChild(chip);
});

// sorting: returns ordered array of show indices; groups get headers
function orderFor(sort) {
  if (sort === "platform") {
    // group by platform, biggest catalogue first; multi-platform shows
    // appear under their biggest platform; "Not streaming" groups last
    const groups = counts.map(([p]) => p);
    if (!groups.includes(NONE)) groups.push(NONE);
    const out = [];
    groups.forEach(p => {
      (byPlatform[p] || []).forEach(i => { if (!out.includes(i)) out.push(i); });
    });
    SHOWS.forEach((_, i) => { if (!out.includes(i)) out.push(i); });
    return out;
  }
  if (sort === "title") {
    return SHOWS.map((s, i) => [s[0].toLowerCase(), i])
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([, i]) => i);
  }
  return SHOWS.map((_, i) => i); // rank
}

function groupNameFor(sort, index) {
  if (sort === "platform") {
    const plats = SHOWS[index][2];
    // show under the group whose platform list contains it first
    const group = counts.find(([p]) => plats.includes(p));
    return group ? group[0] : NONE;
  }
  if (sort === "title") return SHOWS[index][0][0].toUpperCase();
  return null; // rank: no headers
}

function applySortAndFilter() {
  const lis = {};
  list.querySelectorAll("li:not(.grouphead)").forEach(li => lis[li.dataset.title] = li);

  // rebuild the list in one pass so headers always sit before their group
  while (list.firstChild) list.firstChild.remove();

  let shown = 0;
  let lastGroup = null;
  orderFor(activeSort).forEach(i => {
    const [title, years, platforms] = SHOWS[i];
    const li = lis[title];
    const match = !activePlatform ||
      platforms.includes(activePlatform);
    li.classList.toggle("hidden", !match);
    if (!match) return;
    shown++;
    const group = groupNameFor(activeSort, i);
    if (group !== null && group !== lastGroup) {
      const h = document.createElement("li");
      h.className = "grouphead";
      const n = byPlatform[group] ? byPlatform[group].length : 0;
      h.innerHTML = group.replace(/</g, "&lt;") +
        (activeSort === "platform" ? '<span class="gn">' + n + ' shows</span>' : "");
      list.appendChild(h);
      lastGroup = group;
    }
    list.appendChild(li);
  });
  status.textContent = (activePlatform ? activePlatform + " — " : "") +
    shown + " of 100 shown · " + seen.size + " watched";
}

// sort buttons
document.querySelectorAll("button.sort").forEach(btn => {
  btn.addEventListener("click", () => {
    activeSort = btn.dataset.sort;
    document.querySelectorAll("button.sort").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    applySortAndFilter();
  });
});

function save() {
  localStorage.setItem(KEY, JSON.stringify([...seen]));
  applySortAndFilter();
}

document.getElementById("markAll").addEventListener("click", () => {
  SHOWS.forEach(([t]) => seen.add(t));
  render();
});

document.getElementById("clearAll").addEventListener("click", () => {
  seen.clear();
  render();
});

function render() {
  list.querySelectorAll("li").forEach(li => {
    const on = seen.has(li.dataset.title);
    li.querySelector("input").checked = on;
    li.classList.toggle("watched", on);
  });
  save();
}

applySortAndFilter();
</script>
</body>
</html>
